<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥接控制台</title>
<style>
:root{font-family:"Microsoft YaHei UI",sans-serif;color:#182a27;background:#eef2ed}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:0 auto;padding:56px 28px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid #c9d6cc;padding-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.17em;color:#587369;font-weight:700}h1{font-size:36px;letter-spacing:-1px;margin:10px 0 4px}p{color:#61756c;font-size:14px;line-height:1.7}button{border:0;background:#1f5748;color:#fff;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:14px}button:hover{background:#143e33}button:disabled{opacity:.5;cursor:wait}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.card,.panel{background:#fff;border:1px solid #dbe5dc;border-radius:12px;padding:22px}.label{font-size:13px;color:#71837a}.value{font-size:21px;font-weight:700;margin-top:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d3a246;margin-right:9px}.ok{background:#43a174}.bad{background:#d26052}.panel h2{font-size:18px;margin:0}.panel-head{display:flex;justify-content:space-between;align-items:center}.hint{font-size:12px;color:#84948a}ul{list-style:none;padding:0;margin:18px 0 0;max-height:440px;overflow:auto}li{display:flex;gap:24px;padding:12px 0;border-top:1px solid #edf1ed;font-size:14px}time{color:#8b9c91;font-variant-numeric:tabular-nums;min-width:80px}.footer{font-size:12px;color:#82938a;margin-top:20px}@media(max-width:650px){main{padding:30px 18px}header{align-items:start;flex-direction:column}.cards{grid-template-columns:1fr}h1{font-size:28px}}
:root{color:#4c382a;background:#f5e9ce}body{background:linear-gradient(#e5f3e7 0 205px,#f5e9ce 205px)}main{max-width:1060px;padding-top:34px}header{position:relative;align-items:center;gap:24px;border:3px solid #76573e;background:#fff6da;padding:24px 28px;box-shadow:6px 6px 0 #d8c29b}.hero{display:flex;align-items:center;gap:22px}.logo{width:128px;height:128px;object-fit:cover;image-rendering:pixelated;border:3px solid #76573e;background:#f8e2b7}.eyebrow{color:#78934e;letter-spacing:.14em}h1{font-size:34px;color:#533c29}p{color:#846c50}.cards{gap:16px;margin:26px 0}.card,.panel{border:3px solid #8c6e50;border-radius:3px;background:#fff9e8;box-shadow:4px 4px 0 #dfc99e}.card{position:relative;overflow:hidden;padding-bottom:35px}.card:after{content:'';position:absolute;bottom:0;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,#ad794e 0 18px,#bf8a59 18px 36px)}.card.stream:after{background:repeating-linear-gradient(90deg,#79b9dc 0 22px,#a1d5e9 22px 38px)}.card.codex:after{background:repeating-linear-gradient(90deg,#91b969 0 18px,#b0d589 18px 36px)}.label{color:#8b7359;font-weight:700}.value{color:#59422e;font-size:20px}.panel h2{color:#5c432f}.hint,.footer{color:#917e64}li{border-color:#f0e3c8}time{color:#a08b70}.dot{border-radius:1px;width:10px;height:10px}button{background:#67944e;border:3px solid #496e38;border-radius:2px;box-shadow:3px 3px 0 #d2bd91;font-weight:700;white-space:nowrap}button:hover{background:#517d3c}.panel-head{gap:12px}.footer{margin-top:22px}@media(max-width:650px){.hero{align-items:flex-start}.logo{width:72px;height:72px}header{padding:18px}.cards{grid-template-columns:1fr}h1{font-size:25px}}
.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:22px 0}.scene{overflow:hidden;background:#fff9e8;border:3px solid #8c6e50;box-shadow:4px 4px 0 #dfc99e}.scene[hidden]{display:none}.scenes:has(.scene:not([hidden])){min-height:1px}.scenes:not(:has(.scene:not([hidden]))){display:none}.scene img{display:block;width:100%;height:180px;object-fit:cover;image-rendering:pixelated}.scene-text{padding:15px 18px}.scene-text strong{font-size:18px}.scene-text p{margin:5px 0 0;font-size:13px}.scene.sleep{background:#28263f;border-color:#69536a;color:#fff1cd}.scene.sleep p{color:#d9c9bd}.scene.unknown{border-style:dashed}.scene.unknown p{margin:0}.scene.unknown .scene-text{padding:18px}
</style></head><body><main><header><div class="hero"><img class="logo" src="/farm-logo.png" alt="小农夫与蓝色小鸟像素标志"><div><div class="eyebrow">PIXEL FARM · 桥接小农场</div><h1>今天的农场，一切可好？</h1><p>小鸟捎来消息，小农夫认真耕耘。来看看连接与任务的近况吧。</p></div></div><button id="restart">重新接通小溪</button></header><section class="cards"><div class="card stream"><div class="label">小溪流向 · 钉钉 Stream</div><div class="value"><span class="dot" id="ding-dot"></span><span id="ding">读取中</span></div></div><div class="card codex"><div class="label">农夫工坊 · Codex</div><div class="value"><span class="dot" id="codex-dot"></span><span id="codex">读取中</span></div></div><div class="card"><div class="label">田间任务 · 账号绑定</div><div class="value" id="tasks">读取中</div></div></section><section class="scenes" aria-live="polite"><article class="scene" id="bird-scene" hidden><img src="/bird-search.png" alt="小农夫在溪边寻找小鸟"><div class="scene-text"><strong>寻找小鸟中…</strong><p>钉钉连接暂不可用，正在等待连接恢复。</p></div></article><article class="scene sleep" id="sleep-scene" hidden><img src="/farmer-sleep.png" alt="夜晚小农夫在家中休息"><div class="scene-text"><strong>农夫的休息时间</strong><p>Codex 尚未初始化或已退出，工坊暂时停工。</p></div></article><article class="scene unknown" id="unknown-scene" hidden><div class="scene-text"><strong>暂时看不清农场近况</strong><p>桥接状态不可用，请检查桥接程序或重新打开控制台。</p></div></article></section><section class="panel"><div class="panel-head"><h2>田间日志</h2><span class="hint">最近 100 条 · 只记动作，不记正文</span></div><ul id="events"><li>还没有新的田间记录</li></ul></section><p class="footer" id="status">正在查看农场近况…</p></main><script>
const token=location.hash.slice(1)||sessionStorage.getItem('bridge-console-token')||'';if(token)sessionStorage.setItem('bridge-console-token',token);history.replaceState(null,'',location.pathname);const headers={'X-Console-Token':token};const byId=id=>document.getElementById(id);
async function refresh(){try{const r=await fetch('/status',{headers,cache:'no-store'});if(!r.ok)throw Error('status');const d=await r.json();const offline=d.stale;byId('ding').textContent=offline?'状态不可用':d.dingtalk;byId('codex').textContent=offline?'状态不可用':d.codex;byId('ding-dot').className='dot '+(!offline&&d.dingtalk==='已连接'?'ok':'bad');byId('codex-dot').className='dot '+(!offline&&d.codex==='已初始化'?'ok':'bad');byId('tasks').textContent=offline?'—':`${d.active} 个处理中 · ${d.paired?'已绑定':'未绑定'}`;const ul=byId('events');ul.replaceChildren();for(const e of (d.events||[]).slice().reverse()){const li=document.createElement('li'),t=document.createElement('time'),a=document.createElement('span');t.textContent=new Date(e.time).toLocaleTimeString();a.textContent=e.action;li.append(t,a);ul.append(li)}if(!ul.children.length)ul.textContent='暂无记录';byId('status').textContent=offline?'桥接进程未运行或状态已过期。':'状态更新于 '+new Date(d.updatedAt).toLocaleTimeString()+' · 窗口关闭后控制台将在空闲 10 分钟后退出';}catch{byId('status').textContent='控制台连接已中断，请重新打开。'}}
byId('restart').onclick=async()=>{if(!confirm('重启会中断当前正在处理的任务，确定重启吗？'))return;const b=byId('restart');b.disabled=true;try{const r=await fetch('/restart',{method:'POST',headers});byId('status').textContent=r.ok?'已请求重启，等待状态更新。':'重启失败，请检查计划任务。'}catch{byId('status').textContent='重启请求失败。'}finally{b.disabled=false}};refresh();setInterval(refresh,5000);
// 异常场景独立显示；快照过期时不猜测钉钉或 Codex 的实际状态。
async function refreshScenes(){try{const r=await fetch('/status',{headers,cache:'no-store'});if(!r.ok)throw Error('status');const d=await r.json();byId('unknown-scene').hidden=!d.stale;byId('bird-scene').hidden=!!d.stale || d.dingtalk==='已连接';byId('sleep-scene').hidden=!!d.stale || d.codex==='已初始化';}catch{byId('unknown-scene').hidden=false;byId('bird-scene').hidden=true;byId('sleep-scene').hidden=true}}
refreshScenes();setInterval(refreshScenes,5000);
</script></body></html>
