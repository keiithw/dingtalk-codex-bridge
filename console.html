<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥接控制台</title>
<style>
:root{font-family:"Microsoft YaHei UI",sans-serif;color:#182a27;background:#eef2ed}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:0 auto;padding:56px 28px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid #c9d6cc;padding-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.17em;color:#587369;font-weight:700}h1{font-size:36px;letter-spacing:-1px;margin:10px 0 4px}p{color:#61756c;font-size:14px;line-height:1.7}button{border:0;background:#1f5748;color:#fff;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:14px}button:hover{background:#143e33}button:disabled{opacity:.5;cursor:wait}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.card,.panel{background:#fff;border:1px solid #dbe5dc;border-radius:12px;padding:22px}.label{font-size:13px;color:#71837a}.value{font-size:21px;font-weight:700;margin-top:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d3a246;margin-right:9px}.ok{background:#43a174}.bad{background:#d26052}.panel h2{font-size:18px;margin:0}.panel-head{display:flex;justify-content:space-between;align-items:center}.hint{font-size:12px;color:#84948a}ul{list-style:none;padding:0;margin:18px 0 0;max-height:440px;overflow:auto}li{display:flex;gap:24px;padding:12px 0;border-top:1px solid #edf1ed;font-size:14px}time{color:#8b9c91;font-variant-numeric:tabular-nums;min-width:80px}.footer{font-size:12px;color:#82938a;margin-top:20px}@media(max-width:650px){main{padding:30px 18px}header{align-items:start;flex-direction:column}.cards{grid-template-columns:1fr}h1{font-size:28px}}
:root{color:#4c382a;background:#f5e9ce}body{background:linear-gradient(#e5f3e7 0 205px,#f5e9ce 205px)}main{max-width:1060px;padding-top:34px}header{position:relative;align-items:center;gap:24px;border:3px solid #76573e;background:#fff6da;padding:24px 28px;box-shadow:6px 6px 0 #d8c29b}.hero{display:flex;align-items:center;gap:22px}.logo{width:128px;height:128px;object-fit:cover;image-rendering:pixelated;border:3px solid #76573e;background:#f8e2b7}.eyebrow{color:#78934e;letter-spacing:.14em}h1{font-size:34px;color:#533c29}p{color:#846c50}.cards{gap:16px;margin:26px 0}.card,.panel{border:3px solid #8c6e50;border-radius:3px;background:#fff9e8;box-shadow:4px 4px 0 #dfc99e}.card{position:relative;overflow:hidden;padding-bottom:35px}.card:after{content:'';position:absolute;bottom:0;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,#ad794e 0 18px,#bf8a59 18px 36px)}.card.stream:after{background:repeating-linear-gradient(90deg,#79b9dc 0 22px,#a1d5e9 22px 38px)}.card.codex:after{background:repeating-linear-gradient(90deg,#91b969 0 18px,#b0d589 18px 36px)}.label{color:#8b7359;font-weight:700}.value{color:#59422e;font-size:20px}.panel h2{color:#5c432f}.hint,.footer{color:#917e64}li{border-color:#f0e3c8}time{color:#a08b70}.dot{border-radius:1px;width:10px;height:10px}button{background:#67944e;border:3px solid #496e38;border-radius:2px;box-shadow:3px 3px 0 #d2bd91;font-weight:700;white-space:nowrap}button:hover{background:#517d3c}.panel-head{gap:12px}.footer{margin-top:22px}@media(max-width:650px){.hero{align-items:flex-start}.logo{width:72px;height:72px}header{padding:18px}.cards{grid-template-columns:1fr}h1{font-size:25px}}
.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:22px 0}.scene{overflow:hidden;background:#fff9e8;border:3px solid #8c6e50;box-shadow:4px 4px 0 #dfc99e}.scene[hidden]{display:none}.scenes:has(.scene:not([hidden])){min-height:1px}.scenes:not(:has(.scene:not([hidden]))){display:none}.scene img{display:block;width:100%;height:180px;object-fit:cover;image-rendering:pixelated}.scene-text{padding:15px 18px}.scene-text strong{font-size:18px}.scene-text p{margin:5px 0 0;font-size:13px}.scene.sleep{background:#28263f;border-color:#69536a;color:#fff1cd}.scene.sleep p{color:#d9c9bd}.scene.unknown{border-style:dashed}.scene.unknown p{margin:0}.scene.unknown .scene-text{padding:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.toolbar button{margin:0!important}dialog{width:min(540px,90vw);max-height:85vh;overflow:auto;border:3px solid #76573e;background:#fff9e8;color:#4c382a;box-shadow:6px 6px 0 #d8c29b}dialog::backdrop{background:#30251799}dialog h2{margin:0 0 16px}dialog label{display:block;margin:14px 0 5px;font-weight:bold}dialog input,dialog select{width:100%;padding:10px;border:2px solid #bda786;background:#fffdf4;color:#4c382a;font:inherit}dialog .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}dialog .message{white-space:pre-wrap}dialog .settings-bird{width:80px;float:right;image-rendering:pixelated}dialog li{display:block}dialog li button{margin-top:8px;white-space:normal}
</style></head><body><main><header><div class="hero"><img class="logo" src="/farm-logo.png" alt="小农夫与蓝色小鸟像素标志"><div><div class="eyebrow">PIXEL FARM · 桥接小农场</div><h1>今天的农场，一切可好？</h1><p>小鸟捎来消息，小农夫认真耕耘。来看看连接与任务的近况吧。</p></div></div><button id="restart">重新接通小溪</button></header><section class="cards"><div class="card stream"><div class="label">小溪流向 · 钉钉 Stream</div><div class="value"><span class="dot" id="ding-dot"></span><span id="ding">读取中</span></div></div><div class="card codex"><div class="label">农夫工坊 · Codex</div><div class="value"><span class="dot" id="codex-dot"></span><span id="codex">读取中</span></div></div><div class="card"><div class="label">田间任务 · 账号绑定</div><div class="value" id="tasks">读取中</div></div></section><section class="scenes" aria-live="polite"><article class="scene" id="bird-scene" hidden><img src="/bird-search.png" alt="小农夫在溪边寻找小鸟"><div class="scene-text"><strong>寻找小鸟中…</strong><p>钉钉连接暂不可用，正在等待连接恢复。</p></div></article><article class="scene sleep" id="sleep-scene" hidden><img src="/farmer-sleep.png" alt="夜晚小农夫在家中休息"><div class="scene-text"><strong>农夫的休息时间</strong><p>Codex 尚未初始化或已退出，工坊暂时停工。</p></div></article><article class="scene unknown" id="unknown-scene" hidden><div class="scene-text"><strong>暂时看不清农场近况</strong><p>桥接状态不可用，请检查桥接程序或重新打开控制台。</p></div></article></section><section class="panel"><div class="panel-head"><h2>田间日志</h2><span class="hint">最近 100 条 · 只记动作，不记正文</span></div><ul id="events"><li>还没有新的田间记录</li></ul></section><p class="footer" id="status">正在查看农场近况…</p></main><script>
const token=location.hash.slice(1)||sessionStorage.getItem('bridge-console-token')||'';if(token)sessionStorage.setItem('bridge-console-token',token);history.replaceState(null,'',location.pathname);const headers={'X-Console-Token':token};const byId=id=>document.getElementById(id);
async function refresh(){try{const r=await fetch('/status',{headers,cache:'no-store'});if(!r.ok)throw Error('status');const d=await r.json();const offline=d.stale;byId('ding').textContent=offline?'状态不可用':d.dingtalk;byId('codex').textContent=offline?'状态不可用':d.codex;byId('ding-dot').className='dot '+(!offline&&d.dingtalk==='已连接'?'ok':'bad');byId('codex-dot').className='dot '+(!offline&&d.codex==='已初始化'?'ok':'bad');byId('tasks').textContent=offline?'—':`${d.active} 个处理中 · ${d.paired?'已绑定':'未绑定'}`;const ul=byId('events');ul.replaceChildren();for(const e of (d.events||[]).slice().reverse()){const li=document.createElement('li'),t=document.createElement('time'),a=document.createElement('span');t.textContent=new Date(e.time).toLocaleTimeString();a.textContent=e.action;li.append(t,a);ul.append(li)}if(!ul.children.length)ul.textContent='暂无记录';byId('status').textContent=offline?'桥接进程未运行或状态已过期。':'状态更新于 '+new Date(d.updatedAt).toLocaleTimeString()+' · 窗口关闭后控制台将在空闲 10 分钟后退出';}catch{byId('status').textContent='控制台连接已中断，请重新打开。'}}
byId('restart').onclick=async()=>{if(!confirm('重启会中断当前正在处理的任务，确定重启吗？'))return;const b=byId('restart');b.disabled=true;try{const r=await fetch('/restart',{method:'POST',headers});byId('status').textContent=r.ok?'已请求重启，等待状态更新。':'重启失败，请检查计划任务。'}catch{byId('status').textContent='重启请求失败。'}finally{b.disabled=false}};refresh();setInterval(refresh,5000);
// 群消息仅在用户打开时读取；正文作为文本显示，图片通过鉴权请求加载。
const mentionButton=document.createElement('button');mentionButton.textContent='@机器人消息';mentionButton.style.marginTop='24px';document.querySelector('.cards').before(mentionButton);
const mentionPanel=document.createElement('section');mentionPanel.className='panel';mentionPanel.hidden=true;mentionPanel.style.marginBottom='22px';const mentionTitle=document.createElement('h2');mentionTitle.textContent='小鸟的来信 · @机器人';const mentionHint=document.createElement('p');mentionHint.textContent='只记录已授权群中 @机器人的消息，最多保留最近 100 条；从启用后开始记录。';const mentionList=document.createElement('ul');mentionPanel.append(mentionTitle,mentionHint,mentionList);document.querySelector('.cards').after(mentionPanel);let mentionImages=[];
mentionButton.onclick=async()=>{if(!mentionPanel.hidden){mentionPanel.hidden=true;for(const u of mentionImages)URL.revokeObjectURL(u);mentionImages=[];mentionList.replaceChildren();return}mentionPanel.hidden=false;mentionList.textContent='正在查看来信…';mentionButton.disabled=true;try{const r=await fetch('/mentions',{headers,cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();mentionHint.textContent='仅已授权群中 @机器人的最近 100 条；从启用后开始记录。可让 Codex 查询本地目录：'+data.directory;mentionList.replaceChildren();for(const m of data.messages){const li=document.createElement('li'),wrap=document.createElement('div'),meta=document.createElement('strong'),text=document.createElement('div');wrap.style.minWidth='0';meta.textContent=m.group+' · '+m.sender+' · '+new Date(m.receivedAt).toLocaleString();text.textContent=m.text||'['+m.messageType+']';text.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0';wrap.append(meta,text);for(const image of m.images||[]){try{const response=await fetch('/mention-image/'+encodeURIComponent(image.file),{headers,cache:'no-store'});if(!response.ok)throw Error();const url=URL.createObjectURL(await response.blob());mentionImages.push(url);const img=document.createElement('img');img.src=url;img.alt='群消息图片';img.loading='lazy';img.style.cssText='max-width:220px;max-height:180px;object-fit:contain;margin:4px';wrap.append(img)}catch{const error=document.createElement('div');error.textContent='图片读取失败';wrap.append(error)}}for(const error of m.imageErrors||[]){const line=document.createElement('div');line.textContent=error;wrap.append(line)}li.append(wrap);mentionList.append(li)}if(!data.messages.length)mentionList.textContent='暂时没有记录。'}catch{mentionList.textContent='读取失败，请检查桥接和归档目录。'}finally{mentionButton.disabled=false}};
// 恢复控制台管理入口；所有配置和会话操作仍由本机鉴权接口处理。
const toolbar=document.createElement('nav');toolbar.className='toolbar';toolbar.setAttribute('aria-label','农场管理');mentionButton.before(toolbar);mentionButton.style.marginTop='';
function toolButton(label,action){const button=document.createElement('button');button.textContent=label;button.onclick=action;toolbar.append(button);return button}
function dialog(title,content){const box=document.createElement('dialog');box.innerHTML='<h2></h2>'+content+'<p class="message" aria-live="polite"></p><div class="actions"><button type="button" class="close">关闭</button></div>';box.querySelector('h2').textContent=title;document.body.append(box);box.querySelector('.close').onclick=()=>box.close();box.addEventListener('close',()=>box.remove());box.showModal();return box}
async function api(url,body){const options={headers,cache:'no-store'};if(body!==undefined){options.method='POST';options.headers={...headers,'Content-Type':'application/json'};options.body=JSON.stringify(body)}const response=await fetch(url,options);let data={};try{data=await response.json()}catch{}if(!response.ok)throw Error(data.message||data.error||'操作失败，请稍后重试');return data}
toolButton('机器人配置',async()=>{const d=dialog('小鸟的通行证','<img class="settings-bird" src="/bird-settings.png" alt="戴眼罩的小鸟"><label for="client-id">Client ID</label><input id="client-id" autocomplete="off"><label for="client-secret">Client Secret</label><input id="client-secret" type="password" autocomplete="new-password"><p>密钥留空表示沿用当前机器人密钥；更换 Client ID 时请填写新密钥。</p>');const msg=d.querySelector('.message'),actions=d.querySelector('.actions'),id=d.querySelector('#client-id'),secret=d.querySelector('#client-secret');try{const data=await api('/robot-config');id.value=data.clientId;secret.placeholder=data.hasSecret?'已保存，留空沿用':'请输入 Client Secret'}catch(e){msg.textContent=e.message}for(const [label,url] of [['测试连接','/robot-test'],['保存','/robot-config']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{const result=await api(url,{clientId:id.value,clientSecret:secret.value});msg.textContent=result.message;if(url==='/robot-config')secret.value=''}catch(e){msg.textContent=e.message}finally{b.disabled=false}};actions.prepend(b)}});
toolButton('模型与推理',async()=>{const d=dialog('选择农夫的工具','<label for="model-choice">模型</label><select id="model-choice"></select><label for="effort-choice">推理强度</label><select id="effort-choice"></select><p>选择应用于后续消息，包括当前及新建会话；可选项由本机 Codex 提供。</p>');const msg=d.querySelector('.message'),model=d.querySelector('#model-choice'),effort=d.querySelector('#effort-choice');try{const data=await api('/models');function option(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)}option(model,'','Codex 默认模型');for(const m of data.models)option(model,m.id,m.name+(m.isDefault?'（默认）':''));model.value=data.selected;function updateEffort(){effort.replaceChildren();option(effort,'','模型默认');const selected=data.models.find(m=>m.id===model.value);for(const e of selected?.efforts||[])option(effort,e.value,e.value+(e.value===selected.defaultEffort?'（默认）':''));if(model.value===data.selected)effort.value=data.effort}model.onchange=updateEffort;updateEffort();if(data.truncated)msg.textContent='模型列表过长，仅显示已读取的部分。';const save=document.createElement('button');save.textContent='保存选择';save.onclick=async()=>{save.disabled=true;try{await api('/model',{model:model.value,effort:effort.value});msg.textContent='已保存，后续消息生效。'}catch(e){msg.textContent=e.message}finally{save.disabled=false}};d.querySelector('.actions').prepend(save)}catch(e){msg.textContent=e.message}});
toolButton('历史会话',async()=>{const d=dialog('农场的旧故事','<p>选择后，从下一条私聊消息继续该会话。</p><ul class="threads"></ul>');const msg=d.querySelector('.message'),list=d.querySelector('.threads');msg.textContent='正在读取…';try{const data=await api('/threads');msg.textContent=data.truncated?'会话较多，仅显示已读取的部分。':data.threads.length?'':'暂无桥接会话。';for(const t of data.threads){const li=document.createElement('li'),title=document.createElement('div'),b=document.createElement('button');title.textContent=t.title;b.textContent='回到此会话';b.onclick=async()=>{b.disabled=true;try{await api('/switch-private-session',{threadId:t.id});msg.textContent='已选择，下一条私聊消息将继续此会话。'}catch(e){msg.textContent=e.message}finally{b.disabled=false}};li.append(title,b);list.append(li)}}catch(e){msg.textContent=e.message}});
toolButton('开启新私聊会话',async()=>{if(!confirm('下一条私聊消息将开启新会话，历史会话仍可找回。确定继续吗？'))return;try{await api('/new-private-session',{});alert('已准备新会话，下一条私聊消息生效。')}catch(e){alert(e.message)}});
// 换号后让新进程重新加载凭证，并保留旧会话以便用户以后选择。
toolButton('切换账号后刷新',async()=>{if(!confirm('请先在本机完成 Codex 登录。刷新会重启桥接，并让下一条私聊开启新会话，继续吗？'))return;try{const result=await api('/refresh-account',{});alert(result.message)}catch(e){alert(e.message)}});toolbar.append(mentionButton);
// 异常场景独立显示；快照过期时不猜测钉钉或 Codex 的实际状态。
async function refreshScenes(){try{const r=await fetch('/status',{headers,cache:'no-store'});if(!r.ok)throw Error('status');const d=await r.json();byId('unknown-scene').hidden=!d.stale;byId('bird-scene').hidden=!!d.stale || d.dingtalk==='已连接';byId('sleep-scene').hidden=!!d.stale || d.codex==='已初始化';}catch{byId('unknown-scene').hidden=false;byId('bird-scene').hidden=true;byId('sleep-scene').hidden=true}}
refreshScenes();setInterval(refreshScenes,5000);
</script></body></html>
